<main class="page">
  <header class="top">
    <button type="button" class="menu-btn" id="menuBtn" aria-label="打開選單" aria-expanded="false" aria-controls="drawer"></button>
    <h1><span id="appTitle">OSam</span></h1>
    <nav class="tabs" role="tablist" aria-label="分頁">
      <button type="button" role="tab" id="tabIdeas" aria-selected="false" aria-controls="ideasView">想法</button>
      <button type="button" role="tab" id="tabSec" aria-selected="true" aria-controls="secView">助理</button>
    </nav>
  </header>
  <p class="empty" id="status">正在連線…</p>
  <section class="view" id="ideasView" role="tabpanel" aria-labelledby="tabIdeas" hidden>
    <div class="view" id="topicList">
      <div class="stack" id="topics"></div>
      <div class="greet" id="topicsEmpty"><span class="greet-o" id="greetO"></span><p id="greetText"></p></div>
    </div>
    <div class="view" id="topicView" hidden>
      <button type="button" class="back" id="back">← 所有主題</button>
      <article class="card" id="note" aria-live="polite"></article>
      <div id="noteFiles"></div>
    </div>
  </section>
  <section class="view" id="secView" role="tabpanel" aria-labelledby="tabSec">
    <section class="card soon-card" id="soonCard" hidden>
      <h2>快到期</h2>
      <ul class="plain" id="soonList"></ul>
    </section>
    <section class="card routines" id="routineCard" hidden>
      <h2>例行</h2>
      <ul class="plain" id="routineList"></ul>
    </section>
    <section class="card memory" aria-live="polite">
      <h2>記住的事 <span class="count" id="memCount">0</span></h2>
      <p class="empty" id="memEmpty">還沒有</p>
      <ul class="plain" id="memList"></ul>
    </section>
    <div class="stack" id="lists" aria-live="polite"></div>
    <div id="secFiles"></div>
  </section>
  <section class="view" id="pageView" hidden></section>
  <section class="view" id="pickView" hidden>
    <h2 class="page-title">選擇一個頁面來檢視</h2>
    <div class="stack" id="pickList"></div>
  </section>
</main>
<div class="drawer-back" id="drawerBack" hidden></div>
<nav class="drawer" id="drawer" aria-label="選單" hidden>
  <div class="drawer-head"><b id="drawerTitle">OSam</b><button type="button" class="close" id="drawerClose" aria-label="關閉選單">×</button></div>
  <div class="drawer-pane" id="drawerNavPane">
  <div class="drawer-sec">頁首分頁</div>
  <div class="drawer-list" id="drawerMain"></div>
  <div class="drawer-sec" id="drawerPagesHead">其他頁面</div>
  <div class="drawer-list" id="drawerPages"></div>
  <p class="pin-note" id="pinNote" hidden></p>
  </div>
  <div class="drawer-pane" id="drawerSettings" hidden></div>
  <div class="drawer-foot">
    <button type="button" class="foot-btn" id="settingsBtn" aria-label="設定" aria-expanded="false"></button>
    <div class="seg" id="themeSeg" role="group" aria-label="深淺色">
      <button type="button" data-theme="light" aria-label="淺色"><span class="seg-ico"></span></button>
      <button type="button" data-theme="dark" aria-label="深色"><span class="seg-ico"></span></button>
    </div>
  </div>
</nav>
<div class="dock" id="dock" hidden>
  <div class="peek" id="peek" hidden>
    <button type="button" class="peek-body" id="peekBody"></button>
    <button type="button" class="peek-x" id="peekX" aria-label="收起預覽">×</button>
    <div class="peek-actions" id="peekActions" hidden></div>
  </div>
  <div class="pics" id="barPics" hidden></div>
  <form class="bar glow" id="bar">
    <button type="button" class="avatar" id="expand" aria-label="展開對話" aria-expanded="false" aria-controls="chat"></button>
    <textarea id="barInput" rows="1" enterkeyhint="send" placeholder="跟助理說…" aria-label="跟 OSam 說"></textarea>
    <button type="button" class="pic-btn" id="barPic" aria-label="加檔案" hidden></button>
    <button type="button" class="speak" id="speak" aria-pressed="false" aria-label="朗讀回覆" title="朗讀回覆" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk-body" d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z"/><path class="spk-on" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.7 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="spk-off" d="m15.6 9.6 4.8 4.8m0-4.8-4.8 4.8"/></svg></button>
    <button type="submit" class="send" id="barSend" aria-label="送出"></button>
  </form>
</div>
<input type="file" id="picFile" accept="image/*,application/pdf" multiple hidden>
<div class="confirm" id="confirm" hidden><div class="cf-card" id="confirmCard" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"></div></div>
<section class="chat" id="chat" role="dialog" aria-labelledby="chatTitle" hidden>
  <div class="chat-head">
    <div class="avatar sm" id="headAvatar"></div>
    <div class="who"><b id="chatTitle">OSam · 助理</b><span id="chatStatus"></span></div>
    <button type="button" class="pill" id="speakHead" aria-pressed="false" hidden>朗讀</button>
    <button type="button" class="pill" id="clear">清空</button>
    <button type="button" class="close" id="close" aria-label="關閉對話">×</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="pics in-chat" id="askPics" hidden></div>
  <form class="ask" id="askForm">
    <button type="button" class="pic-btn" id="askPic" aria-label="加檔案" hidden></button>
    <textarea id="askInput" rows="1" enterkeyhint="send" placeholder="跟助理說…" aria-label="跟 OSam 說"></textarea>
    <button type="submit" class="send" id="askSend" aria-label="送出"></button>
